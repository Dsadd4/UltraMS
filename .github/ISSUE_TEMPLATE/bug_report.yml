name: Bug report
description: Report a reproducible problem with the package, examples, or benchmarks
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: UltraMS version
      description: Output of `python -c "import ultrams; print(ultrams.__version__)"`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, device (CPU/CUDA/MPS), torch and transformers versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Command or Python snippet, and the smallest spectrum/file input that triggers the problem
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or output
      render: shell
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inference / embeddings
        - Spectrum file parsing
        - Fine-tuning
        - Pretraining
        - Benchmarks
        - Documentation
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem
          required: true
        - label: I removed credentials and private paths from the report
          required: true
