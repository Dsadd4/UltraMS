name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to do, and why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: API sketch, command, or documentation change you have in mind
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inference / embeddings
        - Spectrum file parsing
        - Fine-tuning
        - Pretraining
        - Benchmarks
        - Documentation
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation first
          required: true
