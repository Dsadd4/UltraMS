[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrams"
version = "0.2.0"
description = "Pretrained UltraMS models for mass spectrometry"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.1",
  "transformers>=4.33,<5",
  "huggingface-hub>=0.23,<1",
]

[project.optional-dependencies]
io = ["pyteomics>=4.6"]

[project.scripts]
ultrams-embed = "ultrams.cli:main"

[project.urls]
Homepage = "https://github.com/Dsadd4/UltraMS"
Source = "https://github.com/Dsadd4/UltraMS"

[tool.setuptools.packages.find]
where = ["src"]
